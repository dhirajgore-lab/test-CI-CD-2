name: SDF Validation
run-name: validate

on: [push]

jobs:
  sdf-validate:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # Step 3: Setup Java
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      # Step 4: Install SuiteCloud CLI
      - name: Install SuiteCloud CLI
        run: npm install -g --acceptSuiteCloudSDKLicense @oracle/suitecloud-cli

      # Step 5: Recreate private key from secret
      - name: Recreate private key
        run: echo "${{ secrets.PRIVATE_KEY }}" | base64 --decode > private.pem

      - name: Debug private key
        run: head -n 5 private.pem

      - name: Debug Secrets
        run: |
          echo "ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}"
          echo "CERT_ID length: ${#CERT_ID}"
          echo "Private key length: ${#PRIVATE_KEY}"
        env:
          CERT_ID: ${{ secrets.CERT_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}


      # Step 6: Authenticate with certificate
      - name: Authenticate SuiteCloud
        run: |
          suitecloud account:setup:ci \
            --authid CI_SANDBOX \
            --account ${{ secrets.ACCOUNT_ID }} \
            --certificateid ${{ secrets.CERT_ID }} \
            --privatekeypath ./private.pem


      # Step 7: Verify SuiteCloud auth list
      - name: Verify SuiteCloud accounts
        run: suitecloud account:list

      # Step 8: Validate project (dry run)
      - name: Validate SDF project
        run: suitecloud project:validate --authid CI_SANDBOX

          