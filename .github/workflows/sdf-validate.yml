name: SDF Validation
run-name: validate

on: [push]

jobs:
  sdf-validate:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      - name: Install dependencies
        run: npm ci --acceptsuitecloudsdklicense

      # Add node_modules/.bin to PATH
      - name: Add suitecloud CLI to PATH
        run: echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      # Restore credentials file from secret
      - name: Restore NetSuite credentials
        run: |
          mkdir -p ~/.suitecloud-sdk/credentials
          echo "${{ secrets.NS_CREDENTIALS_B64 }}" | base64 --decode > ~/.suitecloud-sdk/credentials/credentials_ci.p12

      # Set CI/CD environment variables
      - name: Set CI/CD environment variables
        run: |
          echo "SUITECLOUD_CI=1" >> $GITHUB_ENV
          echo "SUITECLOUD_CI_PASSKEY=${{ secrets.NS_CI_PASSKEY }}" >> $GITHUB_ENV

     # Optional: Test auth
      - name: Test SuiteCloud auth
        run: suitecloud list:files --account ${{ secrets.NS_ACCOUNT_ID }}

      # Deploy/validate project
      - name: Validate project
        run: suitecloud project:deploy --dryrun --account ${{ secrets.NS_ACCOUNT_ID }}