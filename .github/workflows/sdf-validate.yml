name: SDF Validation
run-name: validate

on: [push]

jobs:
  sdf-validate:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      - name: Install dependencies
        run: npm ci --acceptsuitecloudsdklicense

      - name: Add suitecloud CLI to PATH
        run: echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      - name: Verify CLI installation
        run: |
          echo "Checking if suitecloud CLI is available..."
          suitecloud --version

      - name: Set CI/CD environment variables
        run: |
          echo "SUITECLOUD_CI=1" >> $GITHUB_ENV
          echo "SUITECLOUD_CI_PASSKEY=${{ secrets.NS_CI_PASSKEY }}" >> $GITHUB_ENV

      - name: Restore NetSuite credentials
        run: |
          mkdir -p ~/.suitecloud-sdk/credentials
          echo "${{ secrets.NS_CRED_P12_B64 }}" | base64 -d > ~/.suitecloud-sdk/credentials/credentials_ci.p12
          chmod 600 ~/.suitecloud-sdk/credentials/credentials_ci.p12

      - name: Verify credentials file
        run: |
          ls -la ~/.suitecloud-sdk/credentials/
          echo "File sizee: $(stat -c%s ~/.suitecloud-sdk/credentials/credentials_ci.p12) bytes"

      - name: Set up account
        run: |
          suitecloud account:setup:ci \
            --account ${{ secrets.NS_ACCOUNT_ID }} \
            --authid github-actions \
            --certificateid ${{ secrets.CERT_ID }} \
            --privatekeypath ~/.suitecloud-sdk/credentials/credentials_ci.p12

      - name: Test authentication
        run: suitecloud account:list