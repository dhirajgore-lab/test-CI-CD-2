name: SDF Validation
run-name: validate

on: [push]

jobs:
  sdf-validate:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      # Step 1: Checkout repository
      - name: Check out repository code
        uses: actions/checkout@v3

      # Step 2: Install Node.js
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      # Step 3: Install JDK
      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      # Step 4: Install npm dependencies
      - name: Install dependencies
        run: npm ci --acceptsuitecloudsdklicense

      # Step 5: Run unit tests
      - name: Run unit tests
        run: npm test

      # Step 6: Authenticate SuiteCloud project
      - name: Authenticate project against ${{ vars.NS_ACCOUNT_ID }}
        run: |
          ./node_modules/.bin/suitecloud account:savetoken \
            --account ${{ vars.NS_ACCOUNT_ID }} \
            --authid ${{ vars.NS_ACCOUNT_ID }} \
            --tokenid ${{ secrets.NS_TOKEN_ID }} \
            --tokensecret ${{ secrets.NS_TOKEN_SECRET }}

      # Step 7: Validate project (Dry Run Deploy)
      - name: Validate project (dry run)
        run: npm run validate
