name: SDF Validation
run-name: validate

on: [push]

jobs:
  sdf-validate:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      # Step 1: Checkout repository
      - name: Check out repository code
        uses: actions/checkout@v3

      # Step 2: Install Node.js
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      # Step 3: Install JDK
      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      # Step 4: Install npm dependencies (with license acceptance)
      - name: Install dependencies
        run: npm ci --acceptsuitecloudsdklicense

      # Step 5: Check SuiteCloud CLI version
      - name: Check SuiteCloud CLI version
        run: npx suitecloud --version

      # Step 6: Authenticate against NetSuite using OAuth2
      - name: Authenticate project against ${{ vars.NS_ACCOUNT_ID }}
        run: |
          npx suitecloud account:setup:ci \
            --authid CI_SANDBOX \
            --account ${{ vars.NS_ACCOUNT_ID }} \
            --client-id ${{ secrets.NS_CLIENT_ID }} \
            --client-secret ${{ secrets.NS_CLIENT_SECRET }}

      # Step 7: Verify auth
      - name: Verify SuiteCloud accounts
        run: npx suitecloud account:list

      # Step 8: Run validation (dry run deployment)
      - name: Validate project
        run: npm run validate
