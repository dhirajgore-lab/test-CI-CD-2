name: SDF Validation
run-name: validate

on: [push]

jobs:
  sdf-validate:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      - name: Install dependencies
        run: npm ci --acceptsuitecloudsdklicense

      - name: Add suitecloud CLI to PATH
        run: echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      - name: Verify CLI installation
        run: |
          echo "Checking if suitecloud CLI is available..."
          which suitecloud || echo "CLI not found in PATH"
          ls -la $(pwd)/node_modules/.bin/suitecloud || echo "CLI binary not found"

      - name: Set CI/CD environment variables
        run: |
          echo "SUITECLOUD_CI=1" >> $GITHUB_ENV
          echo "SUITECLOUD_CI_PASSKEY=${{ secrets.NS_CI_PASSKEY }}" >> $GITHUB_ENV

      - name: Debug base64 secret
        run: |
          echo "Secret first 100 chars:"
          echo "${{ secrets.P12 }}" | head -c 100
          echo ""
          echo "Secret length: $(echo "${{ secrets.P12 }}" | wc -c)"
          echo "Contains valid base64: $(echo "${{ secrets.P12 }}" | base64 -d > /dev/null 2>&1 && echo "YES" || echo "NO")"

      - name: Restore NetSuite credentials
        run: |
          mkdir -p ~/.suitecloud-sdk/credentials
          echo "${{ secrets.P12 }}" | base64 -d > ~/.suitecloud-sdk/credentials/credentials_ci.p12
          chmod 600 ~/.suitecloud-sdk/credentials/credentials_ci.p12

      - name: Restore NetSuite credentials
        run: |
          mkdir -p ~/.suitecloud-sdk/credentials
          echo "${{ secrets.NS_CREDENTIALS_B64 }}" | base64 -d > ~/.suitecloud-sdk/credentials/credentials_ci.p12
          chmod 600 ~/.suitecloud-sdk/credentials/credentials_ci.p12

      - name: Set CI/CD environment variables
        run: |
          echo "SUITECLOUD_CI=1" >> $GITHUB_ENV
          echo "SUITECLOUD_CI_PASSKEY=${{ secrets.NS_CI_PASSKEY }}" >> $GITHUB_ENV

      - name: Set up accounts
        run: suitecloud account:setup:ci --account 4541795_SB1 --authid ci-cd-auth-sb --certificateid zDbiEchk3RUGzR0AN7eYcF6yIwKkhZx8tikFb2qJdzw --privatekeypath ${{ secrets.P12 }}