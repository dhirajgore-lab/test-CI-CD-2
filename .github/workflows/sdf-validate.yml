name: SDF Validation
run-name: validate

on:
  push:
    branches: [add-actions-config]  # Only triggers on push to branch which is named here

jobs:
  sdf-validate:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      - name: Install dependencies
        run: npm ci --acceptsuitecloudsdklicense

      - name: Add suitecloud CLI to PATH
        run: echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      - name: Set CI/CD environment variables
        run: |
          echo "SUITECLOUD_CI=1" >> $GITHUB_ENV
          echo "SUITECLOUD_CI_PASSKEY=${{ secrets.NS_CI_PASSKEY }}" >> $GITHUB_ENV

      - name: Restore private key
        run: |
          echo "${{ secrets.PRIVATE_KEY_PEM_B64 }}" | base64 -d > private_key.pem
          chmod 600 private_key.pem

      - name: Set up account
        run: |
          suitecloud account:setup:ci \
            --account ${{ secrets.NS_ACCOUNT_ID }} \
            --authid github-actions \
            --certificateid ${{ secrets.CERT_ID }} \
            --privatekeypath ./private_key.pem

      - name: List objects
        run: suitecloud project:deploy