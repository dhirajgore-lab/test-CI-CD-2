name: SDF Validation
run-name: validate

on: [push]

jobs:
  sdf-validate:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      # Step 1: Checkout repository
      - name: Check out repository code
        uses: actions/checkout@v3

      # Step 2: Install Node.js
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      # Step 3: Install JDK
      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      # Step 4: Install npm dependencies (with license acceptance)
      - name: Install dependencies
        run: npm ci --acceptsuitecloudsdklicense

      # Step 5: Install SuiteCloud CLI globally (with license acceptance)
      - name: Install SuiteCloud CLI
        run: npm i -g @oracle/suitecloud-cli@latest --acceptSuiteCloudSDKLicense

      # Step 6: Authenticate against NetSuite using TBA
      - name: Authenticate project against ${{ vars.NS_ACCOUNT_ID }}
        run: |
          ./node_modules/.bin/suitecloud account:setup:ci \
            --authid ${{ vars.NS_ACCOUNT_ID }} \
            --account ${{ vars.NS_ACCOUNT_ID }} \
            --client ${{ secrets.NS_TOKEN_ID }} \
            --secret ${{ secrets.NS_TOKEN_SECRET }}

      # Step 7: Verify auth
      - name: Verify SuiteCloud accounts
        run: ./node_modules/.bin/suitecloud account:list

      # Step 8: Run validation (dry run deployment)
      - name: Validate project
        run: npm run validate
