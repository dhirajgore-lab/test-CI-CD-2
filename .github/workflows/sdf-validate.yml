name: NetSuite SDF Auth Check

on:
  workflow_dispatch:   # run manually from GitHub Actions UI

jobs:
  auth-test:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # Step 3: Setup Java
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      # Step 4: Install SuiteCloud CLI
      - name: Install SuiteCloud CLI
        run: npm install -g --acceptSuiteCloudSDKLicense @oracle/suitecloud-cli

      # Step 5: Recreate private key
      - name: Recreate private key
        run: echo "${{ secrets.PRIVATE_KEY }}" | base64 --decode > private.pem

      # Step 6: Authenticate SuiteCloud
      - name: Authenticate SuiteCloud
        run: |
          suitecloud account:setup:ci \
            --authid CI_SANDBOX \
            --account ${{ secrets.ACCOUNT_ID }} \
            --certificateid ${{ secrets.CERT_ID }} \
            --privatekeypath ./private.pem

      # Step 7: Verify auth
      - name: Verify SuiteCloud accounts
        run: suitecloud account:list
