name: SDF Validation
run-name: validate

on: [push]

jobs:
  sdf-validate:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      - name: Install dependencies
        run: npm ci --acceptsuitecloudsdklicense

      - name: Add suitecloud CLI to PATH
        run: echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      - name: Verify CLI installation
        run: |
          echo "Checking if suitecloud CLI is available..."
          which suitecloud || echo "CLI not found in PATH"
          ls -la $(pwd)/node_modules/.bin/suitecloud || echo "CLI binary not found"

      - name: Restore NetSuite credentials
        run: |
          mkdir -p ~/.suitecloud-sdk/credentials
          echo "${{ secrets.NS_CREDENTIALS_B64 }}" | base64 --decode > ~/.suitecloud-sdk/credentials/credentials_ci.p12

      - name: Set file permissions
        run: chmod 600 ~/.suitecloud-sdk/credentials/credentials_ci.p12

      - name: Set CI/CD environment variables
        run: |
          echo "SUITECLOUD_CI=1" >> $GITHUB_ENV
          echo "SUITECLOUD_CI_PASSKEY=${{ secrets.NS_CI_PASSKEY }}" >> $GITHUB_ENV

      - name: Debug certificate details
        run: |
          echo "Certificate subject and serial:"
          openssl pkcs12 -in ~/.suitecloud-sdk/credentials/credentials_ci.p12 -clcerts -nokeys -passin pass:"${{ secrets.NS_CI_PASSKEY }}" | openssl x509 -noout -subject -serial -fingerprint -sha256 || echo "Failed to extract certificate details"
          
          echo "Certificate dates:"
          openssl pkcs12 -in ~/.suitecloud-sdk/credentials/credentials_ci.p12 -clcerts -nokeys -passin pass:"${{ secrets.NS_CI_PASSKEY }}" | openssl x509 -noout -dates || echo "Failed to extract dates"

      - name: Set up account
        run: suitecloud account:setup:ci --account 4541795_SB1 --authid ci-cd-1 --certificateid ${{ secrets.CERT_ID }} --privatekeypath ${{ secrets.NS_CREDENTIALS_B64 }}